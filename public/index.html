<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-ZONE Therapists</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- PIN screen -->
  <div id="pinScreen" class="pin-screen">
    <div class="pin-card">
      <div class="brand">E-ZONE Therapists</div>
      <div class="pin-sub">הזן קוד גישה</div>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off" />
      <div id="pinError" class="pin-error" hidden>קוד שגוי</div>
      <button type="button" id="pinSubmit" class="btn btn-primary">כניסה</button>
      <button type="button" id="pinViewer" class="btn btn-ghost">המשך כצופה בלבד</button>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="logo">E-ZONE <span>Therapists</span></div>
      <nav class="tabs">
        <button class="tab active" data-view="outpatient">טיפולי חוץ</button>
        <button class="tab" data-view="inpatient">מטופלים באשפוז</button>
        <button class="tab" data-view="plans">מטופלי חוץ — תוכנית טיפול</button>
      </nav>
      <div class="topbar-right">
        <span id="therapistChip" class="role-badge" title="מטפל/ת">—</span>
        <span id="roleBadge" class="role-badge">צופה</span>
        <button id="refreshBtn" class="btn btn-ghost" title="רענון">↻</button>
        <button id="logoutBtn" class="btn btn-ghost">יציאה</button>
      </div>
    </header>

    <main class="main">
      <!-- Outpatient treatments -->
      <section id="view-outpatient" class="view active">
        <div class="toolbar">
          <input id="outpatientSearch" class="search" placeholder="חיפוש לפי שם מטופל…" />
          <button id="addOutpatientBtn" class="btn btn-primary edit-only">+ רישום טיפול חוץ</button>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="kpi-label">טיפולי חוץ שנרשמו</div><div id="kpiOutCount" class="kpi-value">0</div></div>
          <div class="kpi"><div class="kpi-label">ממתינים לבירור</div><div id="kpiOutFlagged" class="kpi-value">0</div></div>
          <div class="kpi"><div class="kpi-label">אושרו למרות חוב</div><div id="kpiOutApproved" class="kpi-value">0</div></div>
        </div>
        <div class="panel">
          <div class="panel-title">רישומי טיפול חוץ</div>
          <div id="outpatientList" class="billing-list"></div>
        </div>
      </section>

      <!-- Inpatient treatments -->
      <section id="view-inpatient" class="view">
        <div class="toolbar">
          <input id="inpatientSearch" class="search" placeholder="חיפוש לפי שם מטופל…" />
          <button id="addInpatientBtn" class="btn btn-primary edit-only">+ רישום טיפול אשפוז</button>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="kpi-label">טיפולי אשפוז שנרשמו</div><div id="kpiInCount" class="kpi-value">0</div></div>
          <div class="kpi"><div class="kpi-label">מטופלים מאושפזים ברשימה</div><div id="kpiInRoster" class="kpi-value">0</div></div>
        </div>
        <div class="panel">
          <div class="panel-title">רישומי טיפול אשפוז</div>
          <div id="inpatientList" class="billing-list"></div>
        </div>
      </section>

      <!-- Outpatient treatment plans (read-only) -->
      <section id="view-plans" class="view">
        <div class="toolbar">
          <input id="plansSearch" class="search" placeholder="חיפוש לפי שם מטופל…" />
        </div>
        <div id="plansNotice" class="billing-empty" hidden></div>
        <div class="clients-list" id="plansList"></div>
      </section>
    </main>

    <!-- Toast -->
    <div id="toast" class="toast" hidden></div>

    <!-- Outpatient treatment log modal (with inline debt gate + approval) -->
    <div id="outpatientModal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-title">רישום טיפול חוץ</div>
        <form id="outpatientForm" class="form-grid">
          <label class="wide">שם מטופל
            <input name="patientName" list="outpatientNames" autocomplete="off" required />
          </label>
          <datalist id="outpatientNames"></datalist>
          <label>טלפון מטופל (10 ספרות, לדוגמה 0501234567)
            <input name="patientPhone" inputmode="numeric" maxlength="10" placeholder="0501234567" required />
          </label>
          <label>סוג טיפול
            <select name="serviceType" required>
              <option value="">—</option>
              <option>פרטני</option>
              <option>פרטני CBT</option>
              <option>פרטני EMDR</option>
              <option>קבוצה</option>
              <option>טיפול משפחתי</option>
              <option>מעקב פסיכיאטרי</option>
            </select>
          </label>
          <label>תאריך טיפול<input name="treatmentDate" type="date" required /></label>
          <label class="wide">הערות<textarea name="note" rows="2"></textarea></label>

          <!-- Gate result banner -->
          <div id="gateBanner" class="wide" hidden></div>

          <!-- Inline approval (revealed when the patient owes) -->
          <div id="approvalSection" class="wide" hidden>
            <div class="form-section-title">נדרש אישור להמשך טיפול (חוב פתוח)</div>
            <label>מאשר/ת
              <select name="approver">
                <option value="">—</option>
                <option value="ron">רון</option>
                <option value="sandra">סנדרה</option>
              </select>
            </label>
            <label class="wide">הערת אישור<textarea name="approvalNote" rows="2" placeholder="סיבת האישור"></textarea></label>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-ghost" data-close>ביטול</button>
            <button type="submit" class="btn btn-primary" id="outpatientSubmit">בדוק ושמור</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Inpatient treatment log modal (no debt gate) -->
    <div id="inpatientModal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-title">רישום טיפול אשפוז</div>
        <form id="inpatientForm" class="form-grid">
          <label class="wide">שם מטופל
            <input name="patientName" list="inpatientNames" autocomplete="off" required />
          </label>
          <datalist id="inpatientNames"></datalist>
          <label>טלפון מטופל (10 ספרות, לדוגמה 0501234567)
            <input name="patientPhone" inputmode="numeric" maxlength="10" placeholder="0501234567" required />
          </label>
          <label>בית / סניף
            <select name="house">
              <option value="">—</option>
              <option value="raanana">רעננה אשר</option>
              <option value="ramot">רמות השבים</option>
              <option value="efroni">קיסריה עפרוני</option>
              <option value="rehab">קיסריה ריהאב</option>
              <option value="external">חיצוני</option>
            </select>
          </label>
          <label>סוג טיפול
            <select name="serviceType" required>
              <option value="">—</option>
              <option>פרטני</option>
              <option>פרטני CBT</option>
              <option>פרטני EMDR</option>
              <option>קבוצה</option>
              <option>טיפול משפחתי</option>
              <option>מעקב פסיכיאטרי</option>
            </select>
          </label>
          <label>תאריך טיפול<input name="treatmentDate" type="date" required /></label>
          <label class="wide">הערות<textarea name="note" rows="2"></textarea></label>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" data-close>ביטול</button>
            <button type="submit" class="btn btn-primary" id="inpatientSubmit">שמור</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Therapist identity modal (who is logging) -->
    <div id="therapistModal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-title">מי המטפל/ת?</div>
        <form id="therapistForm" class="form-grid">
          <label class="wide">שם המטפל/ת<input name="therapist" required placeholder="שם מלא" /></label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="therapistSubmit">המשך</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="phone.js?v=__BUILD__"></script>
  <script src="debt-gate.js?v=__BUILD__"></script>
  <script src="approval.js?v=__BUILD__"></script>
  <script src="app.js?v=__BUILD__" defer></script>
</body>
</html>
